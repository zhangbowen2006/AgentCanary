name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  moonbit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: moon version --all
      - run: moon check --target all --deny-warn
      - run: moon test --target all --deny-warn
      - run: moon build --target all --deny-warn
      - run: moon fmt --check
      - run: moon info
      - run: git diff --exit-code -- '*.mbti'
      - run: moon run cmd/demo
